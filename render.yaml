services:
  - type: web
    name: ai-video-subtitle-caption-tool
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: MAX_REQUEST_BODY_MB
        value: "20"
      - key: MAX_INLINE_AUDIO_BYTES
        value: "15728640"
      - key: GLOBAL_RATE_LIMIT_MAX
        value: "300"
      - key: AI_RATE_LIMIT_MAX
        value: "30"
